    <!-- WebSocket and Error Resilience for Cloud Preview -->
    <script>
      (function() {
        if (typeof window !== 'undefined') {
          window.addEventListener('unhandledrejection', function(event) {
            var reasonStr = String(event.reason && (event.reason.message || event.reason) || '');
            if (reasonStr.indexOf('WebSocket') !== -1 || reasonStr.indexOf('websocket') !== -1) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          }, true);

          window.addEventListener('error', function(event) {
            var msgStr = String(event.message || '');
            if (msgStr.indexOf('WebSocket') !== -1 || msgStr.indexOf('websocket') !== -1) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          }, true);
        }
      })();
    </script>
    <!-- Theme Initializer: Apply dark mode immediately before page renders -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme') || localStorage.getItem('alshams_theme');
          if (saved === 'dark' || saved === 'night_focus') {
            document.documentElement.classList.add('dark');
          } else if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>
