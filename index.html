    <!-- Early PWA Install Prompt & WebSocket Error Resilience -->
    <script>
      (function() {
        if (typeof window !== 'undefined') {
          window.__alshamsDeferredInstallPrompt = null;
          window.__alshamsPwaInstalled = false;

          window.addEventListener('beforeinstallprompt', function(event) {
            event.preventDefault();
            window.__alshamsDeferredInstallPrompt = event;
            window.dispatchEvent(new CustomEvent('alshams-pwa-prompt-ready'));
          });

          window.addEventListener('appinstalled', function() {
            window.__alshamsDeferredInstallPrompt = null;
            window.__alshamsPwaInstalled = true;
            window.dispatchEvent(new CustomEvent('alshams-pwa-installed'));
          });

          window.addEventListener('unhandledrejection', function(event) {
            var reasonStr = String(event.reason && (event.reason.message || event.reason) || '');
            if (
              reasonStr.indexOf('WebSocket') !== -1 ||
              reasonStr.indexOf('websocket') !== -1 ||
              reasonStr.indexOf('SendBeforeConnectError') !== -1
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          }, true);

          window.addEventListener('error', function(event) {
            var msgStr = String(event.message || '');
            if (
              msgStr.indexOf('WebSocket') !== -1 ||
              msgStr.indexOf('websocket') !== -1 ||
              msgStr.indexOf('SendBeforeConnectError') !== -1
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          }, true);
        }
      })();
    </script>
    <!-- Theme Initializer: Apply dark mode immediately before page renders -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme') || localStorage.getItem('alshams_theme');
          if (saved === 'dark' || saved === 'night_focus') {
            document.documentElement.classList.add('dark');
          } else if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>
