<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&amp;display=swap");
      .titleDark { font-family: "Cairo", "Traditional Arabic", sans-serif; font-size: 82px; font-weight: 900; fill: #38BDF8; letter-spacing: -1px; }
      .subDark { font-family: "Cairo", sans-serif; font-size: 34px; font-weight: 800; fill: #BAE6FD; letter-spacing: 0px; }
      .brandDark { font-family: "Cairo", sans-serif; font-size: 38px; font-weight: 900; fill: #FBBF24; }
      .lineDark { stroke: #F59E0B; stroke-width: 2.5; stroke-linecap: round; }
    </style>
    <filter id="glowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Title Calligraphy with Neon Glow -->
  <g text-anchor="middle" filter="url(#glowDark)">
    <text x="450" y="160" class="titleDark">
      مَنْظُومَـةُ الشَّمْسَـاوِيَّـة
    </text>
  </g>

  <!-- Subtitle -->
  <g text-anchor="middle">
    <text x="450" y="240" class="subDark">
      منظومة سحابية متكاملة لفناني الحرف اليدوية
    </text>
  </g>

  <!-- Elegant Decorative Divider with Brand Accent -->
  <g text-anchor="middle">
    <line x1="120" y1="315" x2="310" y2="315" class="lineDark" />
    <circle cx="310" cy="315" r="4.5" fill="#F59E0B" />
    <text x="450" y="328" class="brandDark">
      مِنْ الشَّـمْـس كَـرَافْـت
    </text>
    <circle cx="590" cy="315" r="4.5" fill="#F59E0B" />
    <line x1="590" y1="315" x2="780" y2="315" class="lineDark" />
  </g>
</svg>